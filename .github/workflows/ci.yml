name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nahom_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nahom_front/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:api
      - run: npm test
      - run: npm run build
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nahom_back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nahom_back/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          SANITY_STUDIO_CONTACT_DATASET: contacts
